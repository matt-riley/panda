name: Homebrew

on:
  workflow_dispatch:

concurrency:
  # Never cancel: a half-updated tap is worse than a queued run.
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  homebrew:
    name: Homebrew tap
    permissions:
      contents: read
    # Needs the commit that taught homebrew-formula.yml to mint from a GitHub
    # App (4.1.0); that lets the tap run on a short-lived installation token
    # scoped to one repository instead of a long-lived PAT.
    uses: matt-riley/matt-riley-ci/.github/workflows/homebrew-formula.yml@f846763f763247cb0140e3dd08002280b001f6cf # v4.2.0
    with:
      tag: ${{ github.ref_name }}
      formula-name: panda
      class-name: Panda
      desc: Modular Rust coding harness with a native macOS sandbox
      homepage: https://github.com/matt-riley/panda
      binary: panda
      archive-x86_64-macos: panda_darwin_amd64.tar.gz
      archive-aarch64-macos: panda_darwin_arm64.tar.gz
      # APP_ID is the tap App, the same one the GoReleaser repos use.
      tap-app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.PRIVATE_KEY }}
