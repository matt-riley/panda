[package]
name = "panda-cli"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
panda-core = { path = "../core" }
panda-local = { path = "../local" }
panda-coding = { path = "../coding" }
panda-providers = { path = "../providers" }
ctrlc = "3"
tempfile = "3"
reedline = "0.53.0"
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"
base64 = "0.22"
libc = "0.2"
walkdir = "2"
shlex = "2"
[[bin]]
name = "panda"
path = "src/main.rs"
[dev-dependencies]
proptest = "1"
tempfile = "3"
panda-memory = { path = "../memory" }
