[package]
name = "panda-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
panda-coding = { path = "../coding" }
panda-core = { path = "../core" }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["form","json","rustls"] }
tokio = { version = "1", features = ["rt","time","macros","process","io-util"] }
ring = "0.17"
fastrand = "2"
walkdir = "2"
globset = "0.4"
ignore = "0.4"
regex = "1"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
rquickjs = "0.14"
serde_yaml_ng = "0.10"

[dev-dependencies]
proptest = "1"
